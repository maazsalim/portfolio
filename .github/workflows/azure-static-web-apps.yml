# Builds and tests the site and API, then deploys both to Azure Static Web Apps.
#   push to main   -> production
#   pull request   -> a temporary preview environment (deleted when the PR closes)
#
# Everything is built here rather than by the Azure action, so the exact
# versions are pinned and a failing lint, typecheck or test blocks the deploy.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # lets the deploy action comment the preview URL on PRs

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    name: Build, test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck
        working-directory: web

      - name: Test API
        run: dotnet test api --configuration Release

      - name: Build site
        run: npm run build
        working-directory: web

      - name: Publish API
        run: dotnet publish api/Portfolio.Api --configuration Release --output api-publish

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Pre-built outputs from the steps above.
          app_location: web/out
          output_location: ""
          api_location: api-publish
          skip_app_build: true
          skip_api_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Remove PR preview
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
